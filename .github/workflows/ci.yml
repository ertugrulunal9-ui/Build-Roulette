name: CI

on:
  push:
  pull_request:
  # Nightly: everything once a day, even without a push.
  schedule:
    - cron: '17 3 * * *'
  # Manual runs also offer the network-bound package compatibility suite (job `compat`)
  # and can leave out the rooms chaos e2e (job `chaos`).
  workflow_dispatch:
    inputs:
      compat:
        description: Run the R1 package compatibility suite against the npm registry
        type: boolean
        default: true
      compat_cdn:
        description: Package CDN for the compatibility suite, as a base URL (e.g. https://esm.sh). Empty = our own CDN (@br/pkg-cdn, started by the suite)
        type: string
        default: ''
      chaos:
        description: Run the rooms chaos e2e (network drops, skewed clocks, refreshes; 3 shards of ~5 min)
        type: boolean
        default: true
      loadtest:
        description: Run the load test smoke profile (3 rooms × 4 players, ~5 min) on a fresh stack and upload its report
        type: boolean
        default: false

permissions:
  contents: read

# A new push cancels the older run of the same branch. The nightly run has its own group: a
# push used to cancel it halfway (run 29, its chaos job never finished).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Reads the pnpm version from the "packageManager" field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  db:
    name: Database tests (local Supabase stack, pgTAP + API and Realtime e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Same CLI version as the local instructions (supabase/README.md).
      SUPABASE_CLI: supabase@2.119.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The multiplayer and Realtime scripts use @supabase/supabase-js, resolved from apps/web.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tests need Postgres (with pg_cron), Auth, PostgREST, Storage, Realtime (broadcast
      # from the database, private-channel authorization, presence) and the Kong gateway.
      # Everything else is excluded to keep the start fast. `supabase start` applies the
      # migrations to a fresh database.
      - name: Start the local Supabase stack
        run: >-
          npx -y "$SUPABASE_CLI" start
          -x studio,imgproxy,vector,logflare,edge-runtime,supavisor,mailpit,postgres-meta

      - name: Run pgTAP tests (supabase test db)
        run: npx -y "$SUPABASE_CLI" test db

      # Drives the solo loop through the real HTTP APIs (storage RLS, MIME/size limits,
      # pg_cron). Needs psql, which the runner image ships.
      - name: Run the API end-to-end check
        run: |
          psql --version
          node supabase/scripts/e2e-solo.mjs

      # A 3-player battle through Auth, PostgREST, Storage, Realtime and pg_cron (T-016).
      - name: Run the multiplayer end-to-end check
        run: node supabase/scripts/e2e-multiplayer.mjs

      # Private topics, gap-free broadcast versions, presence, refused subscriptions (T-016).
      - name: Run the Realtime check
        run: node supabase/scripts/e2e-realtime.mjs

      # REVEAL and VOTING (T-019): storage reads of revealed builds, host controls, secret
      # ballots, vote_progress, tallies and awards.
      - name: Run the reveal and vote check
        run: node supabase/scripts/e2e-reveal-vote.mjs

      # Moderation (T-024): failed join codes committed and rate-limited (HTTP 429), the
      # name filter, report → email admin (seed-admin.mjs) → takedown, not_admin.
      - name: Run the moderation check
        run: node supabase/scripts/e2e-moderation.mjs

      # Runbooks (T-030): every SQL block in docs/runbooks/ runs on fixtures (read-only
      # blocks in a READ ONLY transaction, writing blocks rolled back); shell blocks are
      # syntax-checked. Needs psql (runner image).
      - name: Check the runbooks
        run: node supabase/scripts/check-runbooks.mjs

      - name: Stop the stack
        if: always()
        run: npx -y "$SUPABASE_CLI" stop --no-backup

  capture:
    name: Capture worker + jobs function integration, solo game e2e (local Supabase stack + Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_CLI: supabase@2.119.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same Chromium build as the e2e job (playwright-core 1.56.1 → chromium-1194), plus
      # its system libraries. The renderer uses channel 'chromium' (full Chromium).
      - name: Install Playwright Chromium
        run: pnpm --filter @br/capture-worker exec playwright-core install --with-deps chromium

      # Same services as the db job: Postgres (pg_cron, pg_net), Auth, PostgREST, Storage, Kong,
      # and the Edge Runtime for the jobs function (T-034).
      - name: Start the local Supabase stack
        run: >-
          npx -y "$SUPABASE_CLI" start
          -x studio,imgproxy,vector,logflare,supavisor,mailpit,realtime,postgres-meta

      # Renderer tests (real shell capture page, no Supabase) and the full capture/destroy
      # loop against the stack: solo battles through the HTTP APIs, real React bundles,
      # WebP screenshots, fallback, final-attempt failure, destroy. Needs psql (runner image).
      - name: Run the capture worker integration tests
        id: capture-integration
        run: pnpm --filter @br/capture-worker test:integration

      # The jobs Edge Function (T-034, production on the free plan) in the local Edge Runtime
      # (`supabase functions serve`), against the Browser Rendering stand-in, the shell's
      # capture page and Storage: capture, thumbnail fallback, budget spent, 429s, a run
      # killed mid-capture, destroy, takedown, pg_cron → pg_net → function with Vault.
      - name: Run the jobs function integration tests
        if: ${{ !cancelled() && steps.capture-integration.outcome != 'skipped' }}
        run: pnpm --filter @br/capture-worker test:function

      # The solo game end to end on the same stack: the static export (pnpm build) served by
      # `wrangler pages dev` like Cloudflare Pages serves it (apps/web/e2e/app-server.ts),
      # the sandbox shell with the capture gate, the mock CDN and the jobs Edge Function
      # started by pg_cron, rendering through the Browser Rendering stand-in
      # (apps/web/scripts/solo-services.ts). Ship path to the permanent page, and the
      # auto-ship path. Same Chromium as above (Playwright 1.56.1). Needs psql.
      - name: Run the solo game e2e
        if: ${{ !cancelled() && steps.capture-integration.outcome != 'skipped' }}
        run: pnpm --filter @br/web test:e2e:solo

      # Moderation (T-024): a player reports a build on /battles/[id], the admin (seeded with
      # supabase/scripts/seed-admin.mjs) signs in at /admin (its session in the tab's
      # sessionStorage, apart from the player's), sees the report and takes the build down;
      # the next load of the page shows "Removed by moderators" and the jobs function's
      # takedown job deletes the screenshot object. Also: /admin is the not-found screen for
      # a player, sign-out revokes the session, and a blocked display name shows the
      # friendly error. Needs psql.
      - name: Run the moderation e2e
        if: ${{ !cancelled() && steps.capture-integration.outcome != 'skipped' }}
        run: pnpm --filter @br/web test:e2e:moderation

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: solo-e2e-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: npx -y "$SUPABASE_CLI" stop --no-backup

  multiplayer:
    name: Rooms e2e (local Supabase stack with Realtime + Playwright Chromium, 3+ players)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_CLI: supabase@2.119.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One Chromium for the players (Playwright 1.56.1) and the capture worker (same build).
      - name: Install Playwright Chromium
        run: pnpm --filter @br/capture-worker exec playwright-core install --with-deps chromium

      # Rooms need Realtime (private channels, broadcasts from the database, Presence), so
      # unlike the capture job this stack keeps it.
      - name: Start the local Supabase stack (with Realtime)
        run: >-
          npx -y "$SUPABASE_CLI" start
          -x studio,imgproxy,vector,logflare,supavisor,mailpit,postgres-meta

      # Several browser contexts (anonymous players) against the static export served by
      # `wrangler pages dev`, the sandbox shell,
      # the mock CDN and the jobs function (apps/web/scripts/solo-services.ts --realtime):
      # create/join, lobby presence, ready/start, ship and auto-ship, ranked results with
      # screenshots, REVEAL (host controls, a frozen build skipped locally), VOTE (revote,
      # refresh, early end) and vote-based results, destroy, rematch, a late spectator, a
      # refresh mid-BUILD, kick. Plus phones (e2e/multiplayer-mobile.spec.ts, iPhone 13
      # emulation in Chromium): a phone hosts, the desktop-needed notice in BUILD, the
      # still-first REVEAL with "Tap to run live", VOTE with taps (latest tap wins), RESULTS,
      # the /u/[id] history page, and no sideways scrolling. Needs psql.
      - name: Run the rooms e2e
        id: rooms-e2e
        run: pnpm --filter @br/web test:e2e:multi

      # Error reporting and analytics (T-030) against a local fake ingest: a build with the
      # Sentry DSN and PostHog key set (events arrive scrubbed, nothing from the sandbox),
      # then a build without them (nothing loaded, nothing sent).
      - name: Run the telemetry e2e
        if: ${{ !cancelled() && steps.rooms-e2e.outcome != 'skipped' }}
        run: pnpm --filter @br/web test:e2e:telemetry

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: multiplayer-e2e-results
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: npx -y "$SUPABASE_CLI" stop --no-backup

  # The chaos e2e (about 13 minutes of real, shortened deadlines; up to 10 browser contexts)
  # runs as 3 shards in parallel, each on its own runner with its own stack: about 5 minutes
  # of tests per shard (apps/web/playwright.chaos.config.ts), so it fits every push. Manual
  # runs can leave it out (input `chaos`).
  chaos:
    name: Rooms chaos e2e, shard ${{ matrix.shard }}/3 (network drops, skewed clocks, refreshes, host leaves, T-0, abandoned, 8 players, full room)
    if: github.event_name != 'workflow_dispatch' || inputs.chaos
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Every shard reports, even when another one failed.
      fail-fast: false
      matrix:
        # 1: 6 players under chaos, abandoned, full room. 2: random chaos, everyone gone at
        # T-0. 3: every other test (REVEAL/VOTE chaos, steady typing, the lost Realtime feed,
        # 8 players, and any new test without a @chaos-1/@chaos-2 tag).
        shard: [1, 2, 3]
    env:
      SUPABASE_CLI: supabase@2.119.0
      CHAOS_SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @br/capture-worker exec playwright-core install --with-deps chromium

      # Same stack as the rooms e2e: Realtime, pg_cron, Storage, Auth, PostgREST.
      - name: Start the local Supabase stack (with Realtime)
        run: >-
          npx -y "$SUPABASE_CLI" start
          -x studio,imgproxy,vector,logflare,supavisor,mailpit,postgres-meta

      # e2e/chaos.spec.ts, the shard picked by CHAOS_SHARD: 6 players under chaos, REVEAL
      # and VOTE under chaos (a refresh mid-REVEAL, a vote cast offline and retried, a player
      # offline until the vote closes, the host leaving mid-VOTE), a seeded random run (the
      # seed is in the log and the report; CHAOS_SEED replays it), steady typing vs the
      # presence limit, everyone gone at T-0, an abandoned battle, an 8-player battle, a full
      # room, Realtime losing its database feed mid-REVEAL. Needs psql and docker (the
      # lost-feed test, and the container logs of a failed test).
      - name: Run the rooms chaos e2e (shard ${{ matrix.shard }}/3)
        run: pnpm --filter @br/web test:e2e:chaos

      # A failed test's trace, screenshots and diagnostics (players.md, db.json,
      # services.log, docker-*.log: e2e/diagnostics.ts), and the HTML report.
      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-e2e-results-shard-${{ matrix.shard }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: npx -y "$SUPABASE_CLI" stop --no-backup

  e2e:
    name: E2E (runtime + web playground, Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Installs the Chromium build that matches the pinned @playwright/test (1.56.1) into
      # the default cache (~/.cache/ms-playwright), plus its system libraries. Both suites
      # pin the same Playwright version, so they share this browser. The configs use
      # channel 'chromium' (full Chromium, new headless) for site isolation.
      - name: Install Playwright Chromium
        run: pnpm --filter @br/runtime exec playwright install --with-deps chromium

      # Every runtime suite against the mock CDN, then the render and CDN-outage suites again
      # with the mock CDN answering like esm.sh (an entry module that re-exports an internal
      # build path; T-035, playwright.esm-sh.config.ts).
      - name: Run runtime e2e tests
        id: runtime-e2e
        run: pnpm --filter @br/runtime test:e2e

      # Runs `pnpm build` (the static export), then the /playground tests and the static
      # site's checks (rewrites, 404, headers, CSP) against `wrangler pages dev` with the
      # local sandbox shell and mock CDN. Also runs when the runtime suite failed, so one CI
      # run reports both.
      - name: Run web playground e2e tests
        if: ${{ !cancelled() && steps.runtime-e2e.outcome != 'skipped' }}
        run: pnpm --filter @br/web test:e2e

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            packages/runtime/test-results/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  compat:
    name: Package compatibility suite (R1, ${{ inputs.compat_cdn || 'our CDN and the npm registry' }})
    # Hits the npm registry (or the CDN given in `compat_cdn`) for ~50 packages, so it only
    # runs when started by hand.
    if: github.event_name == 'workflow_dispatch' && inputs.compat
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Read by compat/run.ts (T-035): empty starts @br/pkg-cdn; a base URL such as
      # https://esm.sh runs every case and the CDN contract checks against that CDN, and the
      # report is RESULTS-<host>.md. Passed as an environment variable, never pasted into the
      # script, and validated by the suite.
      COMPAT_CDN: ${{ inputs.compat_cdn }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @br/pkg-cdn exec playwright install --with-deps chromium

      - name: Run the compatibility suite
        run: pnpm --filter @br/pkg-cdn compat

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-results
          path: |
            apps/pkg-cdn/compat/RESULTS*.md
            apps/pkg-cdn/node_modules/.cache/pkg-cdn-compat/results.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30

  # T-025: the load generator (tools/loadtest) on a fresh stack, smoke profile only (manual
  # runs with the `loadtest` input). Scripted supabase-js clients (no browsers) play full
  # battles with compressed phases while the capture worker renders the screenshots; the
  # report (phase-change propagation, RPC latency, errors, Realtime, storage, capture
  # backlog, DB and container stats) is uploaded. Fails when a battle does not reach
  # DESTROYED. The full profile (50 rooms × 8 players) needs more than a hosted runner.
  loadtest:
    name: Load test (smoke profile, local Supabase stack + capture worker)
    if: github.event_name == 'workflow_dispatch' && inputs.loadtest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_CLI: supabase@2.119.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The capture worker's Chromium (Playwright 1.56.1), as in the capture job.
      - name: Install Playwright Chromium
        run: pnpm --filter @br/capture-worker exec playwright-core install --with-deps chromium

      - name: Start the local Supabase stack (with Realtime)
        run: >-
          npx -y "$SUPABASE_CLI" start
          -x studio,imgproxy,vector,logflare,edge-runtime,supavisor,mailpit,postgres-meta

      - name: Run the load test (smoke profile)
        run: pnpm --filter @br/loadtest smoke --out-dir "$RUNNER_TEMP/loadtest"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-smoke-report
          path: ${{ runner.temp }}/loadtest/
          if-no-files-found: ignore
          retention-days: 30

      - name: Stop the stack
        if: always()
        run: npx -y "$SUPABASE_CLI" stop --no-backup
