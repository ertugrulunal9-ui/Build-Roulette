<!doctype html>
<!-- BUILD "A Magic 8-Ball" × STYLE "Silent film": black and white with film grain over the
     whole frame (canvas noise). The high-entropy end of the corpus. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: #111;
        font-family: Georgia, serif;
        color: #eee;
      }
      .frame {
        position: absolute;
        inset: 40px 80px;
        border: 6px double #ddd;
        display: grid;
        place-items: center;
        text-align: center;
        background: radial-gradient(ellipse, #3a3a3a, #0b0b0b 75%);
      }
      .ball {
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #777, #111 55%, #000);
        display: grid;
        place-items: center;
        margin: 0 auto 24px;
      }
      .win {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        background: #1c1c1c;
        display: grid;
        place-items: center;
        font-size: 15px;
        padding: 10px;
        box-sizing: border-box;
      }
      .card {
        font-size: 40px;
        font-style: italic;
        letter-spacing: 2px;
      }
      canvas {
        position: fixed;
        inset: 0;
        mix-blend-mode: screen;
        opacity: 0.35;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div>
        <div class="ball"><div class="win">REPLY HAZY. TRY AGAIN WITH FEELING.</div></div>
        <div class="card">~ The Oracle Has Spoken ~</div>
      </div>
    </div>
    <canvas id="c" width="1280" height="800"></canvas>
    <script>
      const ctx = document.getElementById('c').getContext('2d');
      const img = ctx.createImageData(1280, 800);
      let s = 5;
      for (let i = 0; i < img.data.length; i += 4) {
        s = (s * 16807) % 2147483647;
        const v = s % 256;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
        img.data[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      for (let i = 0; i < 6; i++) ctx.fillRect(100 + i * 197, 0, 1, 800);
    </script>
  </body>
</html>
