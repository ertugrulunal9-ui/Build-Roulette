name: CI

on:
  push:
  pull_request:
  # Nightly: everything, plus the rooms chaos e2e (job `chaos`, about 10 minutes).
  schedule:
    - cron: '17 3 * * *'
  # Manual runs also offer the network-bound package compatibility suite (job `compat`)
  # and the rooms chaos e2e (job `chaos`).
  workflow_dispatch:
    inputs:
      compat:
        description: Run the R1 package compatibility suite against the npm registry
        type: boolean
        default: true
      chaos:
        description: Run the rooms chaos e2e (network drops, skewed clocks, refreshes; ~10 min)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Reads the pnpm version from the "packageManager" field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  db:
    name: Database tests (local Supabase stack, pgTAP + API and Realtime e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Same CLI version as the local instructions (supabase/README.md).
      SUPABASE_CLI: supabase@2.119.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The multiplayer and Realtime scripts use @supabase/supabase-js, resolved from apps/web.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tests need Postgres (with pg_cron), Auth, PostgREST, Storage, Realtime (broadcast
      # from the database, private-channel authorization, presence) and the Kong gateway.
      # Everything else is excluded to keep the start fast. `supabase start` applies the
      # migrations to a fresh database.
      - name: Start the local Supabase stack
        run: >-
          npx -y "$SUPABASE_CLI" start
          -x studio,imgproxy,vector,logflare,edge-runtime,supavisor,mailpit,postgres-meta

      - name: Run pgTAP tests (supabase test db)
        run: npx -y "$SUPABASE_CLI" test db

      # Drives the solo loop through the real HTTP APIs (storage RLS, MIME/size limits,
      # pg_cron). Needs psql, which the runner image ships.
      - name: Run the API end-to-end check
        run: |
          psql --version
          node supabase/scripts/e2e-solo.mjs

      # A 3-player battle through Auth, PostgREST, Storage, Realtime and pg_cron (T-016).
      - name: Run the multiplayer end-to-end check
        run: node supabase/scripts/e2e-multiplayer.mjs

      # Private topics, gap-free broadcast versions, presence, refused subscriptions (T-016).
      - name: Run the Realtime check
        run: node supabase/scripts/e2e-realtime.mjs

      # REVEAL and VOTING (T-019): storage reads of revealed builds, host controls, secret
      # ballots, vote_progress, tallies and awards.
      - name: Run the reveal and vote check
        run: node supabase/scripts/e2e-reveal-vote.mjs

      - name: Stop the stack
        if: always()
        run: npx -y "$SUPABASE_CLI" stop --no-backup

  capture:
    name: Capture worker integration + solo game e2e (local Supabase stack + Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_CLI: supabase@2.119.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same Chromium build as the e2e job (playwright-core 1.56.1 → chromium-1194), plus
      # its system libraries. The renderer uses channel 'chromium' (full Chromium).
      - name: Install Playwright Chromium
        run: pnpm --filter @br/capture-worker exec playwright-core install --with-deps chromium

      # Same services as the db job: Postgres (pg_cron), Auth, PostgREST, Storage, Kong.
      - name: Start the local Supabase stack
        run: >-
          npx -y "$SUPABASE_CLI" start
          -x studio,imgproxy,vector,logflare,edge-runtime,supavisor,mailpit,realtime,postgres-meta

      # Renderer tests (real shell capture page, no Supabase) and the full capture/destroy
      # loop against the stack: solo battles through the HTTP APIs, real React bundles,
      # WebP screenshots, fallback, final-attempt failure, destroy. Needs psql (runner image).
      - name: Run the capture worker integration tests
        id: capture-integration
        run: pnpm --filter @br/capture-worker test:integration

      # The solo game end to end on the same stack: next build + next start, the sandbox
      # shell with the capture gate, the mock CDN and the capture worker
      # (apps/web/scripts/solo-services.ts). Ship path to the permanent page, and the
      # auto-ship path. Same Chromium as above (Playwright 1.56.1). Needs psql.
      - name: Run the solo game e2e
        if: ${{ !cancelled() && steps.capture-integration.outcome != 'skipped' }}
        run: pnpm --filter @br/web test:e2e:solo

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: solo-e2e-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: npx -y "$SUPABASE_CLI" stop --no-backup

  multiplayer:
    name: Rooms e2e (local Supabase stack with Realtime + Playwright Chromium, 3+ players)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_CLI: supabase@2.119.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One Chromium for the players (Playwright 1.56.1) and the capture worker (same build).
      - name: Install Playwright Chromium
        run: pnpm --filter @br/capture-worker exec playwright-core install --with-deps chromium

      # Rooms need Realtime (private channels, broadcasts from the database, Presence), so
      # unlike the capture job this stack keeps it.
      - name: Start the local Supabase stack (with Realtime)
        run: >-
          npx -y "$SUPABASE_CLI" start
          -x studio,imgproxy,vector,logflare,edge-runtime,supavisor,mailpit,postgres-meta

      # Several browser contexts (anonymous players) against next start, the sandbox shell,
      # the mock CDN and the capture worker (apps/web/scripts/solo-services.ts --realtime):
      # create/join, lobby presence, ready/start, ship and auto-ship, ranked results with
      # screenshots, REVEAL (host controls, a frozen build skipped locally), VOTE (revote,
      # refresh, early end) and vote-based results, destroy, rematch, a late spectator, a
      # refresh mid-BUILD, kick. Plus phones (e2e/multiplayer-mobile.spec.ts, iPhone 13
      # emulation in Chromium): a phone hosts, the desktop-needed notice in BUILD, the
      # still-first REVEAL with "Tap to run live", VOTE with taps (latest tap wins), RESULTS,
      # the /u/[id] history page, and no sideways scrolling. Needs psql.
      - name: Run the rooms e2e
        run: pnpm --filter @br/web test:e2e:multi

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: multiplayer-e2e-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: npx -y "$SUPABASE_CLI" stop --no-backup

  # The chaos e2e takes about 13 minutes (real, shortened deadlines; up to 10 browser
  # contexts), over the ~8 min budget for every push: nightly and on demand.
  chaos:
    name: Rooms chaos e2e (network drops, skewed clocks, refreshes, host leaves, T-0, abandoned, full room)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.chaos)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_CLI: supabase@2.119.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @br/capture-worker exec playwright-core install --with-deps chromium

      # Same stack as the rooms e2e: Realtime, pg_cron, Storage, Auth, PostgREST.
      - name: Start the local Supabase stack (with Realtime)
        run: >-
          npx -y "$SUPABASE_CLI" start
          -x studio,imgproxy,vector,logflare,edge-runtime,supavisor,mailpit,postgres-meta

      # e2e/chaos.spec.ts: 6 players under chaos, REVEAL and VOTE under chaos (a refresh
      # mid-REVEAL, a vote cast offline and retried, a player offline until the vote
      # closes, the host leaving mid-VOTE), a seeded random run (the seed is in the log and
      # the report; CHAOS_SEED replays it), steady typing vs the presence limit, everyone
      # gone at T-0, an abandoned battle, an 8-player battle, a full room. Needs psql.
      - name: Run the rooms chaos e2e
        run: pnpm --filter @br/web test:e2e:chaos

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-e2e-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: npx -y "$SUPABASE_CLI" stop --no-backup

  e2e:
    name: E2E (runtime + web playground, Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Installs the Chromium build that matches the pinned @playwright/test (1.56.1) into
      # the default cache (~/.cache/ms-playwright), plus its system libraries. Both suites
      # pin the same Playwright version, so they share this browser. The configs use
      # channel 'chromium' (full Chromium, new headless) for site isolation.
      - name: Install Playwright Chromium
        run: pnpm --filter @br/runtime exec playwright install --with-deps chromium

      - name: Run runtime e2e tests
        id: runtime-e2e
        run: pnpm --filter @br/runtime test:e2e

      # Runs `next build`, then the /playground tests against `next start` with the local
      # sandbox shell and mock CDN. Also runs when the runtime suite failed, so one CI run
      # reports both.
      - name: Run web playground e2e tests
        if: ${{ !cancelled() && steps.runtime-e2e.outcome != 'skipped' }}
        run: pnpm --filter @br/web test:e2e

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            packages/runtime/test-results/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  compat:
    name: Package compatibility suite (R1, npm registry)
    # Hits the npm registry for ~50 packages, so it only runs when started by hand.
    if: github.event_name == 'workflow_dispatch' && inputs.compat
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @br/pkg-cdn exec playwright install --with-deps chromium

      - name: Run the compatibility suite
        run: pnpm --filter @br/pkg-cdn compat

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-results
          path: |
            apps/pkg-cdn/compat/RESULTS.md
            apps/pkg-cdn/node_modules/.cache/pkg-cdn-compat/results.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30
