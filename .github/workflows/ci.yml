name: CI

on:
  push:
  pull_request:
  # Manual runs also offer the network-bound package compatibility suite (job `compat`).
  workflow_dispatch:
    inputs:
      compat:
        description: Run the R1 package compatibility suite against the npm registry
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Reads the pnpm version from the "packageManager" field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  db:
    name: Database tests (Postgres 16 + pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Same major version as the local harness default (supabase/scripts/test.sh).
      PG_MAJOR: 16
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Ubuntu 24.04 has postgresql-16, postgresql-16-pgtap and pg_prove in its own archive
      # (main/universe), and the runner image already ships PostgreSQL 16. If ubuntu-latest
      # moves to a release without PostgreSQL 16, fall back to the PGDG repository through
      # the setup script that postgresql-common ships.
      - name: Install PostgreSQL ${{ env.PG_MAJOR }}, pgTAP and pg_prove
        run: |
          set -euo pipefail
          pkgs=("postgresql-$PG_MAJOR" "postgresql-$PG_MAJOR-pgtap" libtap-parser-sourcehandler-pgtap-perl)
          apt_install() {
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends "$@"
          }
          # The harness initdb's its own throwaway cluster, so a freshly installed server
          # package must not create and start a default "main" cluster.
          if [[ -f /etc/postgresql-common/createcluster.conf ]]; then
            echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf >/dev/null
          fi
          sudo apt-get update -qq
          if ! apt_install "${pkgs[@]}"; then
            echo "::notice::PostgreSQL $PG_MAJOR packages are not in the runner's apt sources; adding the PGDG repository"
            apt_install postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            apt_install "${pkgs[@]}"
          fi
          # Put the matching psql first on PATH (pg_prove runs psql from PATH).
          echo "/usr/lib/postgresql/$PG_MAJOR/bin" >> "$GITHUB_PATH"
          "/usr/lib/postgresql/$PG_MAJOR/bin/postgres" --version
          pg_prove --version

      - name: Run database tests
        env:
          PG_BIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/bin
        run: bash supabase/scripts/test.sh

  e2e:
    name: Runtime e2e (Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Installs the Chromium build that matches the pinned @playwright/test (1.56.1) into
      # the default cache (~/.cache/ms-playwright), plus its system libraries. The config uses
      # channel 'chromium' (full Chromium, new headless) for site isolation.
      - name: Install Playwright Chromium
        run: pnpm --filter @br/runtime exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm --filter @br/runtime test:e2e

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-e2e-results
          path: packages/runtime/test-results/
          if-no-files-found: ignore
          retention-days: 7

  compat:
    name: Package compatibility suite (R1, npm registry)
    # Hits the npm registry for ~50 packages, so it only runs when started by hand.
    if: github.event_name == 'workflow_dispatch' && inputs.compat
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @br/pkg-cdn exec playwright install --with-deps chromium

      - name: Run the compatibility suite
        run: pnpm --filter @br/pkg-cdn compat

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-results
          path: |
            apps/pkg-cdn/compat/RESULTS.md
            apps/pkg-cdn/node_modules/.cache/pkg-cdn-compat/results.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30
