<!doctype html>
<!-- BUILD "An excuse generator" × STYLE "Green-screen terminal": glowing monospace text. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        height: 100vh;
        background: #020a02;
        color: #33ff66;
        font:
          18px/1.5 'DejaVu Sans Mono',
          monospace;
        text-shadow: 0 0 6px rgba(51, 255, 102, 0.7);
        padding: 32px 48px;
        box-sizing: border-box;
        background-image: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.25) 0 1px,
          transparent 1px 3px
        );
      }
      .cursor {
        display: inline-block;
        width: 11px;
        height: 20px;
        background: #33ff66;
        vertical-align: -3px;
      }
      .dim {
        color: #1d9940;
      }
    </style>
  </head>
  <body>
    <pre id="out"></pre>
    <script>
      const subjects = [
        'My cat',
        'The landlord',
        'Mercury in retrograde',
        'A rogue Roomba',
        'My horoscope',
        'The group chat',
      ];
      const verbs = [
        'deleted',
        'hid',
        'emotionally hijacked',
        'filed a complaint about',
        'ate',
        'unionized',
      ];
      const objects = [
        'my alarm',
        'the car keys',
        'my calendar',
        'the only clean shirt',
        'my motivation',
        'the Wi-Fi',
      ];
      let s = 7;
      const r = (n) => ((s = (s * 16807) % 2147483647), s % n);
      let out = 'EXCUSE-O-MATIC v2.3  (c) 1983  ALL EXCUSES RESERVED\n';
      out += '================================================================\n\n';
      for (let i = 0; i < 16; i++) {
        out += `> generate --reason=${['late', 'gym', 'texts', 'deadline'][r(4)]}\n`;
        out += `  ${subjects[r(6)]} ${verbs[r(6)]} ${objects[r(6)]}. Confidence: ${40 + r(60)}%\n`;
      }
      out += '\n> ';
      document.getElementById('out').innerHTML =
        out.replace(/^(=+)$/m, '<span class="dim">$1</span>') + '<span class="cursor"></span>';
    </script>
  </body>
</html>
