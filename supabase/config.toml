# Supabase CLI (v2) configuration for the local development stack.
# Hand-written and kept minimal; every omitted key uses the CLI default.
# Reference: https://supabase.com/docs/guides/local-development/cli/config

project_id = "build-roulette"

[api]
enabled = true
port = 54321
# Schemas exposed through the Data API. `public` holds the game tables (SELECT
# only, through RLS) and, later, the RPCs.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Hosted projects are created on Postgres 17, like the local stack the tests run on.
major_version = 17

[db.seed]
# Local-only data (e.g. a dev prompt deck) goes in seed.sql. Reference data that
# production needs (vote categories) lives in migrations instead.
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

# Edge Functions (T-034: the `jobs` function processes captures, destroys and takedowns).
# Locally the e2e and the function tests serve it with `supabase functions serve`, so drop
# `edge-runtime` from `supabase start -x …` (supabase/README.md "Jobs").
[edge_runtime]
enabled = true
# Background tasks (EdgeRuntime.waitUntil: the function answers pg_net at once and keeps
# working) need per_worker; the oneshot policy ends the worker with the response.
policy = "per_worker"

[functions.jobs]
# pg_cron calls it with the x-br-cron-secret header, not a user JWT. The function checks
# the secret itself (supabase/functions/jobs/index.ts). Applies to `supabase functions
# deploy jobs` too.
verify_jwt = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
# Zero-setup onboarding (docs/01 §1.1): players sign in anonymously.
enable_anonymous_sign_ins = true
# An anonymous player can later link GitHub or Google to keep their history
# (supabase.auth.linkIdentity), which needs manual linking.
enable_manual_linking = true

# Local only: the e2e scripts (solo, multiplayer, realtime) and the capture tests
# sign up a dozen anonymous users per run, more than the default 30 per hour.
# The hosted project keeps its own limit (dashboard → Auth → Rate limits).
[auth.rate_limit]
anonymous_users = 300

# Bot protection is OFF locally (tests sign up without a token). In production,
# turn on Cloudflare Turnstile (docs/01 §1.3): dashboard → Auth → Bot and Abuse
# Protection → CAPTCHA, provider Turnstile, with the Turnstile secret key; or,
# when the config is pushed from here:
#   [auth.captcha]
#   enabled = true
#   provider = "turnstile"
#   secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"
# The client then passes the Turnstile token to signInAnonymously({ options: { captchaToken } }):
# the web app does so when it is built with NEXT_PUBLIC_TURNSTILE_SITE_KEY (the matching site
# key; T-024). Turn both on together, or every anonymous sign-up fails.
