<!doctype html>
<!-- The old editor's react-ts starter template as rendered (removed in M6): a build
     that changed nothing. Light scheme. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      body {
        margin: 0;
      }
      .app {
        display: grid;
        min-height: 100vh;
        place-content: center;
        gap: 12px;
        text-align: center;
      }
      button {
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>Hello, Build Roulette!</h1>
      <p>Edit src/App.tsx and watch the preview update.</p>
      <button type="button">Clicked 3 times</button>
    </main>
  </body>
