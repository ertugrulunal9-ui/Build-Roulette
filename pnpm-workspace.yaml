packages:
  - apps/*
  - packages/*

# Dependency install scripts we deliberately do not run.
ignoredBuiltDependencies:
  # Only checks for / downloads its native binding, which pnpm already installs as an
  # optional platform package (@unrs/resolver-binding-*).
  - unrs-resolver
  # Its postinstall only verifies/copies the native binary; the JS API finds it through the
  # optional platform package (@esbuild/<platform>) that pnpm installs anyway.
  - esbuild
