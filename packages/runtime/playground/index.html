<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sandbox runtime playground</title>
    <style>
      body {
        margin: 0;
        font:
          13px/1.4 system-ui,
          sans-serif;
        display: grid;
        grid-template-rows: auto 1fr 180px;
        height: 100vh;
      }
      #preview-container {
        min-height: 0;
      }
      #preview-container iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
      #crashed {
        padding: 16px;
        color: #b00;
      }
      pre {
        margin: 0;
        padding: 6px;
        overflow: auto;
        background: #f6f6f6;
        font-size: 12px;
      }
      #toolbar {
        padding: 6px;
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
        border-bottom: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <label
        >Import a built site (dist folder): <input id="folder" type="file" webkitdirectory multiple
      /></label>
      <button id="reset">Reset storage</button>
      <button id="restart">Restart preview</button>
      <span id="status">booting…</span>
    </div>
    <div id="preview-container"></div>
    <pre id="console"></pre>
    <script type="module" src="/playground.js"></script>
  </body>
</html>
