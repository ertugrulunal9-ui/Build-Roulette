<!doctype html>
<!-- BUILD "A pomodoro timer that keeps you honest" × STYLE "Zen minimal". -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #fbfaf7;
        color: #2b2b2b;
        font-family: Georgia, serif;
      }
      .ring {
        width: 420px;
        height: 420px;
        border-radius: 50%;
        border: 2px solid #e6e2da;
        border-top-color: #b4533a;
        display: grid;
        place-items: center;
        transform: rotate(35deg);
      }
      .ring > div {
        transform: rotate(-35deg);
        text-align: center;
      }
      .time {
        font-size: 96px;
        letter-spacing: 4px;
        font-weight: 300;
      }
      .label {
        font-size: 14px;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: #8a857c;
      }
      nav {
        position: fixed;
        bottom: 48px;
        display: flex;
        gap: 40px;
        font-size: 15px;
        color: #8a857c;
      }
      nav b {
        color: #b4533a;
        font-weight: normal;
      }
    </style>
  </head>
  <body>
    <div class="ring">
      <div>
        <div class="time">18:42</div>
        <div class="label">focus · round 3 of 4</div>
      </div>
    </div>
    <nav>
      <b>pause</b><span>skip</span><span>reset</span><span>you have looked away 2 times</span>
    </nav>
  </body>
</html>
