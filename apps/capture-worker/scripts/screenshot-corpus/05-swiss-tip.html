<!doctype html>
<!-- BUILD "A tip calculator for a group dinner" × STYLE "Swiss poster". -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-columns: 1fr 1fr;
        font-family: Helvetica, Arial, sans-serif;
        background: #f2f0ea;
        color: #111;
      }
      .left {
        padding: 48px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .big {
        font-size: 190px;
        font-weight: 800;
        line-height: 0.85;
        letter-spacing: -8px;
      }
      .right {
        background: #e3200f;
        color: #fff;
        padding: 48px;
        display: grid;
        align-content: end;
        gap: 18px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        border-top: 2px solid #fff;
        padding-top: 8px;
        font-size: 26px;
        font-weight: 700;
      }
      small {
        font-size: 14px;
        letter-spacing: 3px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="left">
      <small>Tip / Split / Truth</small>
      <div class="big">€38<br />.40</div>
      <small>per person, 5 people, 18% tip</small>
    </div>
    <div class="right">
      <div class="row"><span>Bill</span><span>162.70</span></div>
      <div class="row"><span>Tip 18%</span><span>29.29</span></div>
      <div class="row"><span>Total</span><span>191.99</span></div>
      <div class="row"><span>Forgot wallet</span><span>1 (Dave)</span></div>
    </div>
  </body>
</html>
